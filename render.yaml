services:
  # ── BACKEND SERVICES ────────────────────────────────────────────────────────
  - type: web
    name: qma-auth-service
    runtime: docker
    dockerContext: .
    dockerfilePath: AuthService/Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: qma-db
          property: connectionString
      - key: Jwt__SecretKey
        value: btOUxwrOAwpVRLmc*#RfL8sdI#vYAZlgRuvO%qpRzxFHKq1V!
      - key: Jwt__Issuer
        value: QuantityMeasurementAPI
      - key: Jwt__Audience
        value: QuantityMeasurementClient

  - type: web
    name: qma-quantity-service
    runtime: docker
    dockerContext: .
    dockerfilePath: QuantityService/Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: Services__History
        value: http://qma-history-service:8080/

  - type: web
    name: qma-history-service
    runtime: docker
    dockerContext: .
    dockerfilePath: HistoryService/Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: qma-db
          property: connectionString
      - key: Jwt__SecretKey
        value: btOUxwrOAwpVRLmc*#RfL8sdI#vYAZlgRuvO%qpRzxFHKq1V!

  - type: web
    name: qma-admin-service
    runtime: docker
    dockerContext: .
    dockerfilePath: AdminService/Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: Services__Auth
        value: http://qma-auth-service:8080/
      - key: Services__History
        value: http://qma-history-service:8080/

  - type: web
    name: qma-api-gateway
    runtime: docker
    dockerContext: .
    dockerfilePath: ApiGateway/Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: Services__Auth
        value: http://qma-auth-service:8080/
      - key: Services__Quantity
        value: http://qma-quantity-service:8080/
      - key: Services__History
        value: http://qma-history-service:8080/
      - key: Services__Admin
        value: http://qma-admin-service:8080/

# ── DATABASE ──────────────────────────────────────────────────────────────────
databases:
  - name: qma-db
    databaseName: qmadb
    user: qmauser
    region: ohio
    plan: free
