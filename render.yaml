services:
  # ── DATABASE ────────────────────────────────────────────────────────────────
  - type: worker
    name: qma-db-server
    runtime: docker
    dockerContext: .
    dockerfilePath: db.Dockerfile # We'll create this to wrap MSSQL
    region: ohio
    plan: starter # Required for disks
    envVars:
      - key: ACCEPT_EULA
        value: Y
      - key: MSSQL_SA_PASSWORD
        value: YourStrong@Password2026!
      - key: MSSQL_PID
        value: Developer
    disk:
      name: mssql-data
      mountPath: /var/opt/mssql
      sizeGB: 1

  # ── BACKEND SERVICES ────────────────────────────────────────────────────────
  - type: web
    name: qma-auth-service
    runtime: docker
    dockerContext: .
    dockerfilePath: AuthService/Dockerfile
    region: ohio
    plan: starter
    envVars:
      - key: ConnectionStrings__DefaultConnection
        value: Server=qma-db-server;Database=AuthServiceDB;User Id=sa;Password=YourStrong@Password2026!;Encrypt=False;
      - key: Jwt__SecretKey
        value: btOUxwrOAwpVRLmc*#RfL8sdI#vYAZlgRuvO%qpRzxFHKq1V!
      - key: Jwt__Issuer
        value: QuantityMeasurementAPI
      - key: Jwt__Audience
        value: QuantityMeasurementClient

  - type: web
    name: qma-quantity-service
    runtime: docker
    dockerContext: .
    dockerfilePath: QuantityService/Dockerfile
    region: ohio
    plan: starter
    envVars:
      - key: Services__History
        value: http://qma-history-service:8080

  - type: web
    name: qma-history-service
    runtime: docker
    dockerContext: .
    dockerfilePath: HistoryService/Dockerfile
    region: ohio
    plan: starter
    envVars:
      - key: ConnectionStrings__DefaultConnection
        value: Server=qma-db-server;Database=HistoryServiceDB;User Id=sa;Password=YourStrong@Password2026!;Encrypt=False;
      - key: Jwt__SecretKey
        value: btOUxwrOAwpVRLmc*#RfL8sdI#vYAZlgRuvO%qpRzxFHKq1V!

  - type: web
    name: qma-admin-service
    runtime: docker
    dockerContext: .
    dockerfilePath: AdminService/Dockerfile
    region: ohio
    plan: starter
    envVars:
      - key: Services__Auth
        value: http://qma-auth-service:8080
      - key: Services__History
        value: http://qma-history-service:8080

  - type: web
    name: qma-api-gateway
    runtime: docker
    dockerContext: .
    dockerfilePath: ApiGateway/Dockerfile
    region: ohio
    plan: starter
    envVars:
      - key: Services__Auth
        value: http://qma-auth-service:8080
      - key: Services__Quantity
        value: http://qma-quantity-service:8080
      - key: Services__History
        value: http://qma-history-service:8080
      - key: Services__Admin
        value: http://qma-admin-service:8080

  # ── FRONTEND ────────────────────────────────────────────────────────────────
  - type: web
    name: qma-angular-app
    runtime: docker
    dockerContext: ../quantity-measurement-app
    dockerfilePath: Dockerfile
    region: ohio
    plan: starter
